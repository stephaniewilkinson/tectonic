<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 72" width="310" height="72"
     role="img" aria-labelledby="tectonic-logo-title">
  <title id="tectonic-logo-title">tectonic plates</title>
  <!-- Barbell plates stacked out of true. A plate lying almost flat is a squashed ellipse,
       and four of them offset sideways and tilted against each other is the same shape as a
       cut through strata that have stopped lying flat: one edge riding up over the one
       under it. That is the whole mark, and it is why this is not the concentric ring the
       first version drew. Plates seen end-on are concentric, but so is a target, and the
       target was what people saw.

       The tilts alternate and the offsets fall left, right, left, right, because a stack
       leaning one way reads as falling over rather than as shifted. The plates stay close to
       one width on purpose: an earlier draft shrank them towards the top, and four ellipses
       tapering as they tilt stop reading as a stack and start reading as a leaf. Plates on a
       bar are near enough the same size, so the unevenness has to live in the offset. Only
       the bottom one is flat, because it is still lying where it was put and everything
       above it has moved.

       Note for anyone editing this file: the rest of the codebase writes a dash as two
       hyphens, and two hyphens inside an XML comment is a parse error. An SVG that does not
       parse does not draw, and because it is loaded through an img element the only symptom
       is the alt text. That has happened twice now, which is why a spec checks for it. -->
  <g>
    <ellipse cx="30" cy="58" rx="27" ry="7.5" fill="#075985"/>
    <ellipse cx="40" cy="45" rx="26" ry="7.5" fill="#84cc16" transform="rotate(-6 40 45)"/>
    <ellipse cx="26" cy="32" rx="25" ry="7" fill="#075985" transform="rotate(5 26 32)"/>
    <ellipse cx="37" cy="19" rx="24" ry="7" fill="#84cc16" transform="rotate(-8 37 19)"/>
  </g>
  <!-- The Blonde faces the site sets its headings in cannot reach this file. An SVG loaded
       through an img element is a separate document: it gets no webfont and no stylesheet
       from the page, and on the consent screen default-src 'none' would refuse it anything
       it tried to fetch for itself. So the words are set in whichever sans the reader's
       system supplies, and those differ in width by a tenth or more. textLength pins the
       run to 214 units either way; without it a wide default sans pushes the last letters
       past the viewBox, which clips them rather than overflowing. -->
  <text x="88" y="45" textLength="214" lengthAdjust="spacingAndGlyphs" font-size="32" font-weight="600"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        fill="#075985">tectonic plates</text>
</svg>
