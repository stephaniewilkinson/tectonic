# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite talks to a real database: app.rb connects at require time, so even
    # the pure unit specs need one to exist once spec_helper loads the app.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tectonic
          POSTGRES_PASSWORD: tectonic
          POSTGRES_DB: tectonic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RACK_ENV: test
      # The suite chooses its own database rather than inheriting the app's, so this is
      # the only URL the job has to name; spec/spec_helper.rb reads it and the migrate
      # step below points a connection at the same database.
      TEST_DATABASE_URL: postgres://tectonic:tectonic@localhost:5432/tectonic_test
      # Roda's sessions plugin rejects a secret under 64 bytes, and app.rb builds
      # the app at require time, so a short one fails the suite before it starts.
      SESSION_SECRET: ci-only-session-secret-not-a-real-credential-padded-to-roda-64-byte-minimum

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Read the version from .ruby-version, which the Gemfile also reads, so
          # the two cannot drift apart the way 3.2.2 did from 3.3.1 and break the
          # build before a single test ran. setup-ruby spells this as a value of
          # ruby-version, not an input of its own.
          ruby-version: .ruby-version
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - name: Migrate the test database
        run: DATABASE_URL="$TEST_DATABASE_URL" bundle exec rake db:migrate

      - name: Run the specs that never open a browser
        run: bundle exec rake test:rack

  # The handful of files that drive a real Firefox run here instead, because a runner is a
  # small shared machine and a browser discarded under the driver on a busy one --
  # NoSuchWindowError, which the same commit does not produce on a quiet machine -- used
  # to take the report on the other forty-odd files down with it. This does not stop the
  # flake; it keeps it legible as one, and leaves a re-run cheap.
  #
  # Everything the two jobs share is written out twice on purpose: Actions does not read
  # YAML anchors, and a matrix would name the checks "test (rack)" and "test (browser)",
  # which is not what branch protection asks for.
  browser:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tectonic
          POSTGRES_PASSWORD: tectonic
          POSTGRES_DB: tectonic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RACK_ENV: test
      TEST_DATABASE_URL: postgres://tectonic:tectonic@localhost:5432/tectonic_test
      SESSION_SECRET: ci-only-session-secret-not-a-real-credential-padded-to-roda-64-byte-minimum
      # These specs drive a real Firefox; there is no display on a runner.
      MOZ_HEADLESS: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Show browser versions
        run: firefox --version && geckodriver --version | head -1

      - name: Migrate the test database
        run: DATABASE_URL="$TEST_DATABASE_URL" bundle exec rake db:migrate

      - name: Run the specs that drive a real Firefox
        run: bundle exec rake test:browser

  # The stylesheet is compiled from the views and committed, so it can go stale the moment
  # somebody adds a class and does not rebuild -- and a stale stylesheet fails in the one
  # place nobody is looking, which is production, silently, for that one element. Rebuilding
  # here and refusing a difference is what keeps the committed file honest.
  #
  # Committed rather than built on deploy because Render's ruby runtime is a ruby runtime:
  # asking it for a Node toolchain to produce a file the repo can just as well carry is a
  # deploy step that can fail at the worst moment for no benefit.
  styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Rebuild the stylesheet
        run: npm run build:css

      - name: Fail if the committed stylesheet is not what the views compile to
        run: git diff --exit-code -- assets/css/styles.css

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: rubocop
        run: bundle exec rubocop

      - name: erb_lint
        run: bundle exec erb_lint views/*/* views/*

  # Does the app boot with only the gems Render actually installs?
  #
  # Render runs `bundle install` without the development and test groups, so a gem that is
  # required directly but only *resolved* through one of those groups is present in every
  # local run and every other job here, and absent in production alone. The deploy then
  # builds, migrates, and dies on `cannot load such file`.
  #
  # That has now happened twice -- `logger`, and `tzinfo` for #349 -- and neither the suite
  # nor the linters could see it, because all three install every group. This installs what
  # production installs and boots what production boots.
  #
  # It needs a database because app.rb connects at require time, and the two secrets because
  # SESSION_SECRET and OAUTH_JWT_PRIVATE_KEY are read at boot and one of them refuses to be
  # absent. They are generated here rather than stored: nothing signs anything that outlives
  # the job.
  production-boot:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tectonic
          POSTGRES_PASSWORD: tectonic
          POSTGRES_DB: tectonic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Install only what production installs
        run: |
          bundle config set --local without 'development test'
          bundle install --jobs 4

      - name: Boot it
        env:
          RACK_ENV: production
          DATABASE_URL: postgres://tectonic:tectonic@localhost:5432/tectonic_test
        run: |
          export SESSION_SECRET=$(ruby -rsecurerandom -e 'print SecureRandom.hex(64)')
          export OAUTH_JWT_PRIVATE_KEY="$(openssl genrsa 2048 2>/dev/null)"
          bundle exec ruby -e "require 'rack'; Rack::Builder.parse_file('config.ru'); puts 'booted'"
