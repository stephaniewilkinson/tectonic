# Render Blueprint. This file is the checked-in source of truth for how tectonic
# deploys, but it does not govern a dashboard-managed service until the service is
# linked as a Blueprint in the Render dashboard. Until then, the change that
# actually matters is putting preDeployCommand's value in the service's
# "Pre-Deploy Command" field.
#
# `name` must match the existing service exactly, otherwise linking this Blueprint
# creates a second service instead of adopting the current one. Env vars are marked
# `sync: false` so the values already set in the dashboard are left untouched --
# in particular SESSION_SECRET, which would log everyone out if regenerated.

# The database, declared so the blueprint describes the whole deployment rather than only
# the half that serves requests (#348). Like the service above, this governs nothing until
# the Blueprint is linked in the dashboard -- `name` matches the existing instance exactly so
# linking adopts it rather than creating a second one, which for a database would be a second
# empty database and a very bad afternoon.
#
# `plan: starter` is not a suggestion here, it is the backup policy. Render Postgres backups
# go by tier: free has none at all, and starter and above get point-in-time recovery over a
# three-day window plus logical backups retained seven days after they are taken. Dropping
# this instance to free would silently remove every backup this app has, which is exactly the
# failure #348 is about and exactly the one nothing would announce.
#
# ipAllowList is deliberately absent rather than set: the current instance allows 0.0.0.0/0,
# and narrowing it from a blueprint that is not yet linked would either do nothing or, once
# linked, lock out whatever is connecting from outside Render. Worth doing, worth doing
# deliberately, and not as a side effect of documenting the database.
databases:
  - name: tectonic_production
    databaseName: tectonic_production_7oho
    plan: starter
    region: oregon
    postgresMajorVersion: "15"

services:
  - type: web
    name: tectonic
    runtime: ruby
    plan: starter # preDeployCommand requires a paid instance type
    buildCommand: bundle install
    preDeployCommand: bundle exec rake db:migrate && bundle exec rake library:exercises
    # Puma with a config file rather than rackup on stock defaults, so the thread count
    # and Sequel's pool are sized from one variable and the fork hook is somewhere.
    # config/puma.rb reads $PORT itself, which is why the flag rackup needed is gone. Like
    # preDeployCommand above, this governs nothing until the Blueprint is linked: until
    # then the change that matters is putting it in the service's "Start Command" field.
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: RACK_ENV
        value: production
      # The MCP transport's DNS-rebinding protection allows only loopback by
      # default, so the deployed endpoint would 403 every request until its real
      # Host values are allow-listed here.
      - key: MCP_ALLOWED_HOSTS
        value: tectonicplates.app,tectonic.onrender.com
      # The public origin the OAuth authorization server and MCP resource server
      # advertise (token audience, resource + AS metadata, discovery URLs). Must be the
      # canonical https origin clients connect to.
      - key: MCP_PUBLIC_BASE_URL
        value: https://tectonicplates.app
      # The RSA private key (PEM) that signs OAuth JWT access tokens; the public half is
      # derived from it. Must be stable across deploys and instances or issued tokens
      # stop verifying -- so it is set once in the dashboard, never regenerated. Generate
      # with: openssl genrsa 2048
      - key: OAUTH_JWT_PRIVATE_KEY
        sync: false
      # The Sentry project DSN error reports are sent to, replacing the error reporter
      # whose token used to be a literal in config.ru in this public repository. A DSN
      # grants event submission rather than access to anything, but it is still a
      # credential and this is still a public repo, so it lives in the dashboard
      # alongside the two above and never in the tree. Absent,
      # the app boots and serves with reporting switched off rather than refusing to
      # start: losing error reporting is not worth an outage.
      - key: SENTRY_DSN
        sync: false
      # Resend's API key, which is the whole of the mail configuration -- lib/tectonic/mailer
      # posts to one endpoint and there is no SMTP anywhere. Absent, the app boots and the
      # reset flow still works end to end except for the send: the link is written to the log
      # instead. That is deliberate, so a checkout or a preview deploy is walkable without a
      # credential, but on production an absent key means nobody can recover an account.
      - key: RESEND_API_KEY
        sync: false
      # The From address. Must be on a domain verified with Resend or the API refuses every
      # send -- which is the most common way this is set up wrongly, so the refusal is logged
      # with Resend's own response body rather than swallowed.
      - key: MAIL_FROM
        value: tectonic plates <noreply@tectonicplates.app>
